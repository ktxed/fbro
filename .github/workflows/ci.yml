name: CI

on:
  pull_request:
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Tool versions come from mise.toml / mise.lock; only the mise binary is pinned here.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.14
          install_args: gitleaks
      - name: Scan git history for secrets
        run: mise run secrets

  site:
    # The user guide in site/ builds without the app: it catches unknown
    # <Shortcut id>s, missing screenshots and broken links on every pull request.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.14
          install_args: node
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - run: mise run ci:site

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.14
          install_args: node
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            clang \
            llvm-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavfilter-dev \
            libavdevice-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: mise run ci:test
