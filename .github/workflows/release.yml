name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      linux_only:
        description: Build only Linux
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            os: linux
            args: ""
          - platform: macos-latest
            os: macos
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            os: windows
            args: ""
    runs-on: ${{ matrix.platform }}
    # A manual run with "Build only Linux" skips macOS and Windows.
    # A tag push ignores the input and builds every platform.
    if: github.event_name != 'workflow_dispatch' || inputs.linux_only != 'true' || matrix.os == 'linux'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          # The AppImage copies every plugin in the runner's GStreamer directory
          # and then uses only that set. WebKit needs h264parse and webvttenc
          # from plugins-bad, and avdec_h264 from libav, to play mp4.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            clang \
            llvm-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavfilter-dev \
            libavdevice-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pulseaudio

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Check version matches the tag
        if: github.event_name == 'push'
        run: node scripts/check-version.mjs --tag ${{ github.ref_name }}

      - name: Check version files agree
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/check-version.mjs

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('fbro {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          args: ${{ matrix.args }}
          releaseBody: |
            Installers for this version are attached below.

            - Linux: AppImage, deb, and rpm.
            - Windows: NSIS installer and MSI. These builds are unsigned, so SmartScreen may warn until you choose More info, then Run anyway.
            - macOS: Apple silicon disk image. This build is unsigned and not notarized. The first time, right-click the app and choose Open. Intel Macs are not in this release.

            There is no in-app updater yet.
