name: Pages

# Builds the user guide in site/ and publishes it to https://ktxed.github.io/fbro/.
# Repository Settings → Pages → Source must be set to "GitHub Actions".

on:
  push:
    branches: [development]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.14
          install_args: node
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - run: mise run ci:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
