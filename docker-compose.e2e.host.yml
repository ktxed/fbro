services:
  fbro-a:
    image: fbro-e2e-host:latest
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile.host-runtime
    user: "${FBRO_E2E_UID:-1000}:${FBRO_E2E_GID:-1000}"
    environment:
      FBRO_WS_BIND: 0.0.0.0:7878
      FBRO_FILESERVER_BIND: 0.0.0.0:17881
      HOME: /state/a/home
      XDG_CONFIG_HOME: /state/a/config
    ports:
      - "17878:7878"
      - "17881:17881"
    volumes:
      - ./artifacts/e2e:/artifacts
      - ./artifacts/e2e/fbro-a/state:/state/a
      - ./artifacts/e2e/fbro-a/work:/work/a
      - ./src-tauri/target/release/fbro:/usr/local/bin/fbro:ro
    command: >
      bash -lc '
        set -o pipefail &&
        rm -rf /state/a/home /state/a/config /work/a/src /work/a/dst &&
        mkdir -p /state/a/home /state/a/config/fbro /work/a/src /work/a/dst &&
        printf "[panels.left]\npath = \"/work/a/src\"\n\n[panels.right]\npath = \"/work/a/dst\"\n" > /state/a/config/fbro/session.toml &&
        xvfb-run -a /usr/local/bin/fbro 2>&1 | tee /artifacts/fbro-a.log
      '

  fbro-b:
    image: fbro-e2e-host:latest
    user: "${FBRO_E2E_UID:-1000}:${FBRO_E2E_GID:-1000}"
    environment:
      FBRO_WS_BIND: 0.0.0.0:7878
      FBRO_FILESERVER_BIND: 0.0.0.0:27881
      HOME: /state/b/home
      XDG_CONFIG_HOME: /state/b/config
    ports:
      - "27878:7878"
      - "27881:27881"
    volumes:
      - ./artifacts/e2e:/artifacts
      - ./artifacts/e2e/fbro-b/state:/state/b
      - ./artifacts/e2e/fbro-b/work:/work/b
      - ./src-tauri/target/release/fbro:/usr/local/bin/fbro:ro
    command: >
      bash -lc '
        set -o pipefail &&
        rm -rf /state/b/home /state/b/config /work/b/src /work/b/dst &&
        mkdir -p /state/b/home /state/b/config/fbro /work/b/src /work/b/dst &&
        printf "[panels.left]\npath = \"/work/b/src\"\n\n[panels.right]\npath = \"/work/b/dst\"\n" > /state/b/config/fbro/session.toml &&
        xvfb-run -a /usr/local/bin/fbro 2>&1 | tee /artifacts/fbro-b.log
      '
