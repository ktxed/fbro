version = 1
name = "CDE Motif"
description = "Common Desktop Environment look: muted blue-grey surfaces, slate selection, sand highlights"
mode = "light"
base = "daylight"

[colors]
bg = "#aeb2c3"
bg-panel = "#cbcedb"
bg-panel-unfocused = "#bcc0d0"
bg-panel-focused = "#d7dae5"
bg-header = "#9399b0"
bg-footer = "#aeb2c3"
bg-input = "#d7dae5"
bg-elev = "#bcc0d0"
bg-focused = "#c3c7d6"
bg-hover = "rgba(95, 106, 140, 0.18)"
bg-row-alt = "rgba(95, 98, 119, 0.08)"
bg-drop = "rgba(95, 106, 140, 0.35)"
bg-modal-overlay = "rgba(40, 42, 58, 0.45)"
bg-tab = "#9fa4b9"
bg-tab-focused-inactive = "#b3b7c9"
bg-tab-active = "#d7dae5"
text = "#000000"
bg-cursor = "#5f6a8c"
bg-cursor-focused = "#5f6a8c"
bg-cursor-unfocused = "#8f94ac"
text-cursor = "#ffffff"
text-cursor-unfocused = "#000000"
bg-selected = "#d9c98a"
text-selected = "#000000"
bg-selected-cursor = "#8a6a1e"
text-selected-cursor = "#ffffff"
text-dir = "#1f2a5c"
text-link = "#7a2e2e"
text-archive = "#5e2e7a"
text-exec = "#1f5f3f"
text-media = "#1f5f6f"
text-dot = "#5a5e70"
text-size = "#3a3e52"
text-path = "#000000"
text-remote = "#2f3f7a"
border = "#7f8398"
border-focus = "#4b5a8a"
border-strong = "#3f4254"
accent = "#5f6a8c"
text-on-accent = "#ffffff"
text-dim = "#3a3e52"
text-muted = "#4f5368"
text-warning = "#8a5a00"
text-danger = "#a01818"
text-success = "#1f6b2f"
text-info = "#1f5f8a"
text-info-strong = "#14405e"
text-highlight = "#8a6a00"
text-paused = "#5a3a9a"
bg-toast = "#e8e0b0"
border-toast = "#3f4254"
text-toast = "#000000"
bg-terminal = "#cbcedb"
bg-terminal-chip = "rgba(174, 178, 195, 0.9)"
bg-terminal-chip-hover = "rgba(0, 0, 0, 0.15)"
text-terminal-chip = "#000000"
text-terminal-chip-hover = "#000000"
# Editor syntax colours: Motif-era dark inks.
syntax-keyword = "#00008b"
syntax-string = "#8b0000"
syntax-number = "#8b008b"
syntax-type = "#006400"
syntax-function = "#00468c"
syntax-property = "#5f3a00"
syntax-tag = "#8b0000"
syntax-operator = "#202040"
syntax-comment = "#4e586b"

[terminal]
background = "#cbcedb"
foreground = "#000000"
cursor = "#000000"
selection_background = "#8f94ac"
