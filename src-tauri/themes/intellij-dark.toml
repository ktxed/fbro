version = 1
name = "IntelliJ Dark"
description = "JetBrains-inspired dark scheme: charcoal surfaces, blue selection, syntax-style accents"
mode = "dark"
base = "fbro-dark"

[colors]
bg = "#1e1f22"
bg-panel = "#2b2d30"
bg-panel-unfocused = "#26282c"
bg-panel-focused = "#2b2d30"
bg-header = "#1e1f22"
bg-footer = "#1e1f22"
bg-input = "#1e1f22"
bg-elev = "#393b40"
bg-focused = "#2e436e"
bg-hover = "rgba(255, 255, 255, 0.06)"
bg-row-alt = "rgba(255, 255, 255, 0.025)"
bg-drop = "rgba(53, 116, 240, 0.30)"
bg-modal-overlay = "rgba(0, 0, 0, 0.5)"
bg-tab = "#26282c"
bg-tab-focused-inactive = "#2b2d30"
bg-tab-active = "#2e436e"
text = "#bcbec4"
bg-cursor = "#2e436e"
bg-cursor-focused = "#2e436e"
bg-cursor-unfocused = "#393b40"
text-cursor = "#ffffff"
text-cursor-unfocused = "#bcbec4"
bg-selected = "rgba(255, 198, 109, 0.20)"
text-selected = "#ffc66d"
bg-selected-cursor = "#3574f0"
text-selected-cursor = "#ffffff"
text-dir = "#56a8f5"
text-link = "#cf8e6d"
text-archive = "#c77dbb"
text-exec = "#6aab73"
text-media = "#2aacb8"
text-dot = "#6f737a"
text-size = "#868a91"
text-path = "#7aa2f7"
text-remote = "#9876aa"
border = "#393b40"
border-focus = "#3574f0"
border-strong = "#4e5157"
accent = "#3574f0"
text-on-accent = "#ffffff"
text-dim = "#868a91"
text-muted = "#6f737a"
text-warning = "#f2c55c"
text-danger = "#f75464"
text-success = "#5fb865"
text-info = "#2aacb8"
text-info-strong = "#56d1dc"
text-highlight = "#ffc66d"
text-paused = "#b189f5"
bg-toast = "#2b2d30"
border-toast = "#4e5157"
text-toast = "#dfe1e5"
bg-terminal = "#1e1f22"
bg-terminal-chip = "rgba(30, 31, 34, 0.8)"
bg-terminal-chip-hover = "rgba(255, 255, 255, 0.15)"
text-terminal-chip = "#bcbec4"
text-terminal-chip-hover = "#ffffff"

[terminal]
background = "#1e1f22"
foreground = "#bcbec4"
cursor = "#ced0d6"
selection_background = "#214283"
