version = 1
name = "IntelliJ Light"
description = "JetBrains-inspired light scheme: near-white surfaces, soft blue selection, syntax-style accents"
mode = "light"
base = "daylight"

[colors]
bg = "#f7f8fa"
bg-panel = "#ffffff"
bg-panel-unfocused = "#f2f3f5"
bg-panel-focused = "#ffffff"
bg-header = "#f0f1f4"
bg-footer = "#f0f1f4"
bg-input = "#ffffff"
bg-elev = "#ffffff"
bg-focused = "#edf3ff"
bg-hover = "rgba(53, 116, 240, 0.08)"
bg-row-alt = "rgba(0, 0, 0, 0.025)"
bg-drop = "rgba(53, 116, 240, 0.20)"
bg-modal-overlay = "rgba(0, 0, 0, 0.30)"
bg-tab = "#ebecf0"
bg-tab-focused-inactive = "#f2f3f5"
bg-tab-active = "#ffffff"
text = "#000000"
bg-cursor = "#dbe7ff"
bg-cursor-focused = "#a6d2ff"
bg-cursor-unfocused = "#dfe1e5"
text-cursor = "#000000"
text-cursor-unfocused = "#000000"
bg-selected = "#fff1c9"
text-selected = "#7a5700"
bg-selected-cursor = "#3574f0"
text-selected-cursor = "#ffffff"
text-dir = "#0033b3"
text-link = "#9e4d00"
text-archive = "#871094"
text-exec = "#067d17"
text-media = "#00627a"
text-dot = "#8c8f99"
text-size = "#6c707e"
text-path = "#2f5fbf"
text-remote = "#4a5fa8"
border = "#dfe1e5"
border-focus = "#3574f0"
border-strong = "#b4b8bf"
accent = "#3574f0"
text-on-accent = "#ffffff"
text-dim = "#6c707e"
text-muted = "#818594"
text-warning = "#a85d00"
text-danger = "#c7222d"
text-success = "#369650"
text-info = "#00627a"
text-info-strong = "#00485c"
text-highlight = "#b06f00"
text-paused = "#6e3fc7"
bg-toast = "#ffffff"
border-toast = "#c9ccd6"
text-toast = "#1e1f22"
bg-terminal = "#ffffff"
bg-terminal-chip = "rgba(255, 255, 255, 0.85)"
bg-terminal-chip-hover = "rgba(0, 0, 0, 0.10)"
text-terminal-chip = "#6c707e"
text-terminal-chip-hover = "#000000"
# Editor syntax colours: IntelliJ New UI Light editor colours.
syntax-keyword = "#0033b3"
syntax-string = "#067d17"
syntax-number = "#1750eb"
syntax-type = "#1b8084"
syntax-function = "#00627a"
syntax-property = "#871094"
syntax-tag = "#0033b3"
syntax-operator = "#080808"
syntax-comment = "#757575"

[terminal]
background = "#ffffff"
foreground = "#080808"
cursor = "#000000"
selection_background = "#a6d2ff"
