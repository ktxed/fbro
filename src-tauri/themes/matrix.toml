version = 1
name = "Matrix"
description = "Monochrome green phosphor terminal look, based on fbro Dark"
mode = "dark"
base = "fbro-dark"

[colors]
bg = "#000000"
bg-panel = "#010a03"
bg-panel-unfocused = "#000502"
bg-panel-focused = "#021207"
bg-header = "#04180a"
bg-footer = "#031008"
bg-input = "#000000"
bg-elev = "#05200d"
bg-focused = "#052610"
bg-hover = "rgba(0, 255, 70, 0.10)"
bg-row-alt = "rgba(0, 255, 70, 0.035)"
bg-drop = "rgba(0, 255, 70, 0.25)"
bg-modal-overlay = "rgba(0, 8, 2, 0.75)"
bg-tab = "#031a0a"
bg-tab-focused-inactive = "#052610"
bg-tab-active = "#0a4a1c"
text = "#2bd95a"
bg-cursor = "#0b5a22"
bg-cursor-focused = "#00ff41"
bg-cursor-unfocused = "#0a4a1c"
text-cursor = "#000000"
text-cursor-unfocused = "#5dff8a"
bg-selected = "rgba(0, 255, 65, 0.22)"
text-selected = "#b6ffc8"
bg-selected-cursor = "#7dffa0"
text-selected-cursor = "#000000"
text-dir = "#00ff41"
text-link = "#8affa8"
text-archive = "#1fae48"
text-exec = "#b6ffc8"
text-media = "#4ee07a"
text-dot = "#167a33"
text-size = "#1c9a40"
text-path = "#5dff8a"
text-remote = "#7cf0a0"
border = "#0c4a1d"
border-focus = "#00ff41"
border-strong = "#14762f"
accent = "#00c030"
text-on-accent = "#000000"
text-dim = "#178f38"
text-muted = "#0f6a28"
text-warning = "#c4ffd2"
text-danger = "#eafff0"
text-success = "#00ff41"
text-info = "#3ddc6a"
text-info-strong = "#8affa8"
text-highlight = "#d4ffdf"
text-paused = "#108a30"
bg-toast = "#03200c"
border-toast = "#00a02c"
text-toast = "#5dff8a"
bg-terminal = "#000000"
bg-terminal-chip = "rgba(0, 20, 6, 0.7)"
bg-terminal-chip-hover = "rgba(0, 255, 65, 0.2)"
text-terminal-chip = "#2bd95a"
text-terminal-chip-hover = "#b6ffc8"
# Editor syntax colours: shades of phosphor green.
syntax-keyword = "#00ff41"
syntax-string = "#b6ffc8"
syntax-number = "#d4ff6a"
syntax-type = "#5dff8f"
syntax-function = "#8affa8"
syntax-property = "#3ddc6a"
syntax-tag = "#00ff41"
syntax-operator = "#c8ffd0"
syntax-comment = "#1f8f3c"

[terminal]
background = "#000000"
foreground = "#33ff66"
cursor = "#00ff41"
selection_background = "#0a5a20"
