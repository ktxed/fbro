version = 1
name = "Windows XP"
description = "Luna-inspired light scheme: beige window faces, classic blue selection, tooltip yellow, black console"
mode = "light"
base = "daylight"

[colors]
bg = "#ece9d8"
bg-panel = "#ffffff"
bg-panel-unfocused = "#f5f4ea"
bg-panel-focused = "#ffffff"
bg-header = "#c1d2ee"
bg-footer = "#ece9d8"
bg-input = "#ffffff"
bg-elev = "#f4f3ee"
bg-focused = "#e8f0fc"
bg-hover = "rgba(49, 106, 197, 0.12)"
bg-row-alt = "rgba(236, 233, 216, 0.55)"
bg-drop = "rgba(49, 106, 197, 0.25)"
bg-modal-overlay = "rgba(0, 0, 0, 0.35)"
bg-tab = "#e3e0cf"
bg-tab-focused-inactive = "#f1efe2"
bg-tab-active = "#ffffff"
text = "#000000"
bg-cursor = "#316ac5"
bg-cursor-focused = "#316ac5"
bg-cursor-unfocused = "#d4d0c8"
text-cursor = "#ffffff"
text-cursor-unfocused = "#000000"
bg-selected = "#fff0b0"
text-selected = "#5c4400"
bg-selected-cursor = "#2e7d2e"
text-selected-cursor = "#ffffff"
text-dir = "#003399"
text-link = "#0033cc"
text-archive = "#7a2a8f"
text-exec = "#2e7d2e"
text-media = "#0e7c86"
text-dot = "#8c8a7a"
text-size = "#5a584c"
text-path = "#0a246a"
text-remote = "#1e4fa8"
border = "#aca899"
border-focus = "#0054e3"
border-strong = "#716f64"
accent = "#245edc"
text-on-accent = "#ffffff"
text-dim = "#5a584c"
text-muted = "#716f64"
text-warning = "#b8600a"
text-danger = "#cc0000"
text-success = "#2e7d2e"
text-info = "#0066b3"
text-info-strong = "#004a80"
text-highlight = "#9a6a00"
text-paused = "#6a3cc0"
bg-toast = "#ffffe1"
border-toast = "#000000"
text-toast = "#000000"
bg-terminal = "#000000"
bg-terminal-chip = "rgba(236, 233, 216, 0.85)"
bg-terminal-chip-hover = "rgba(49, 106, 197, 0.35)"
text-terminal-chip = "#000000"
text-terminal-chip-hover = "#000000"
# Editor syntax colours: Visual Studio classic colours.
syntax-keyword = "#0000ff"
syntax-string = "#a31515"
syntax-number = "#098658"
syntax-type = "#26809b"
syntax-function = "#795e26"
syntax-property = "#001080"
syntax-tag = "#800000"
syntax-operator = "#333333"
syntax-comment = "#008000"

[terminal]
background = "#000000"
foreground = "#c0c0c0"
cursor = "#c0c0c0"
selection_background = "#316ac5"
