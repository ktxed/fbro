version = 1
name = "Solarized Dark"
description = "VS Code-style Solarized Dark: deep teal surfaces, cyan focus, Solarized accents"
mode = "dark"
base = "fbro-dark"

[colors]
bg = "#00212b"
bg-panel = "#002b36"
bg-panel-unfocused = "#00252f"
bg-panel-focused = "#002b36"
bg-header = "#003847"
bg-footer = "#00212b"
bg-input = "#00212b"
bg-elev = "#073642"
bg-focused = "#00303c"
bg-hover = "rgba(42, 161, 152, 0.14)"
bg-row-alt = "rgba(147, 161, 161, 0.05)"
bg-drop = "rgba(42, 161, 152, 0.28)"
bg-modal-overlay = "rgba(0, 20, 26, 0.65)"
bg-tab = "#004052"
bg-tab-focused-inactive = "#00394a"
bg-tab-active = "#002b36"
text = "#839496"
bg-cursor = "#005a6f"
bg-cursor-focused = "#005a6f"
bg-cursor-unfocused = "#073642"
text-cursor = "#eee8d5"
text-cursor-unfocused = "#93a1a1"
bg-selected = "rgba(181, 137, 0, 0.25)"
text-selected = "#b58900"
bg-selected-cursor = "#2aa198"
text-selected-cursor = "#002b36"
text-dir = "#268bd2"
text-link = "#cb4b16"
text-archive = "#d33682"
text-exec = "#859900"
text-media = "#2aa198"
text-dot = "#586e75"
text-size = "#657b83"
text-path = "#93a1a1"
text-remote = "#6c71c4"
border = "#073642"
border-focus = "#2aa198"
border-strong = "#586e75"
accent = "#2aa198"
text-on-accent = "#002b36"
text-dim = "#657b83"
text-muted = "#586e75"
text-warning = "#b58900"
text-danger = "#dc322f"
text-success = "#859900"
text-info = "#268bd2"
text-info-strong = "#5aaee6"
text-highlight = "#cb4b16"
text-paused = "#6c71c4"
bg-toast = "#073642"
border-toast = "#2aa198"
text-toast = "#93a1a1"
bg-terminal = "#002b36"
bg-terminal-chip = "rgba(0, 33, 43, 0.8)"
bg-terminal-chip-hover = "rgba(147, 161, 161, 0.20)"
text-terminal-chip = "#839496"
text-terminal-chip-hover = "#eee8d5"
# Editor syntax colours: Solarized syntax accents.
syntax-keyword = "#859900"
syntax-string = "#2aa198"
syntax-number = "#dd649f"
syntax-type = "#b58900"
syntax-function = "#3295da"
syntax-property = "#858ace"
syntax-tag = "#3295da"
syntax-operator = "#e96630"
syntax-comment = "#7a939b"

[terminal]
background = "#002b36"
foreground = "#839496"
cursor = "#93a1a1"
selection_background = "#073642"
