[package]
name = "fbro"
version = "0.1.0"
edition = "2021"
default-run = "fbro"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
tokio-tungstenite = "0.26"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
http = "1"
regex = "1"
notify = { version = "7", features = ["macos_fsevent"] }
async-trait = "0.1"
sevenz-rust2 = { version = "0.20.2", features = ["compress", "util", "aes256"] }
zip = "8.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"
zbus = { version = "5", default-features = false, features = ["tokio"] }
gtk = "0.18.2"
gdk = "0.18.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
