[package]
name = "fbro"
version = "0.1.0"
edition = "2021"
default-run = "fbro"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
tokio-tungstenite = "0.26"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
http = "1"
regex = "1"
async-channel = "2"
futures = "0.3"
notify = { version = "7", features = ["macos_fsevent"] }
async-trait = "0.1"
rand = "0.8"
sevenz-rust2 = { version = "0.20.2", features = ["compress", "util", "aes256"] }
zip = "8.5.0"
portable-pty = "0.9"
sysinfo = "0.30"
# Remote-fbro identity & pairing
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.22"
mdns-sd = "0.11"
russh = { version = "0.54", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.1"
bytes = "1"
blake3 = { version = "1", features = ["rayon", "mmap"] }
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"
zbus = { version = "5", default-features = false, features = ["tokio"] }
gtk = "0.18.2"
gdk = "0.18.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
ffmpeg-next = { version = "8", optional = true }

[features]
default = ["linux-video"]
# Enable Linux video thumbnails. Requires system libav-dev packages and clang/llvm:
#   sudo apt install libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
#                    libavfilter-dev pkg-config clang llvm-dev ffmpeg
linux-video = ["ffmpeg-next"]

[target.'cfg(not(target_os = "linux"))'.dependencies]
drag = { version = "2.1.0", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
